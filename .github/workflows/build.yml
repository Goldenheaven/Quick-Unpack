name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-2022
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - Win32
          - x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build static libraries
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -find Common7\Tools\VsDevCmd.bat`) do set "VSDEVCMD=%%i"
          if not defined VSDEVCMD (
            echo Visual Studio developer command script was not found.
            exit /b 1
          )
          if /I "${{ matrix.platform }}"=="x64" (
            call "%VSDEVCMD%" -host_arch=x64 -arch=x64 >nul || exit /b 1
            pushd Disasm
            call make64.bat || exit /b 1
            popd
            pushd Lua
            call make64.bat || exit /b 1
            popd
            pushd MiniFMOD\mixer
            call make64.bat || exit /b 1
            move /Y asm64.obj ..\asm64.obj >nul || exit /b 1
            popd
          ) else (
            call "%VSDEVCMD%" -host_arch=x64 -arch=x86 >nul || exit /b 1
            pushd Disasm
            call make32.bat || exit /b 1
            popd
            pushd Lua
            call make32.bat || exit /b 1
            popd
            pushd MiniFMOD\mixer
            call make32.bat || exit /b 1
            move /Y asm32.obj ..\asm32.obj >nul || exit /b 1
            popd
          )

      - name: Upgrade legacy Visual Studio projects
        shell: pwsh
        run: |
          $devenv = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -find Common7\IDE\devenv.com
          if (-not $devenv) {
            throw "Visual Studio devenv.com was not found"
          }
          & $devenv QUnpack.sln /Upgrade
          & $devenv MiniFMOD\minifmod.sln /Upgrade

      - name: Build MiniFMOD
        shell: cmd
        run: >
          msbuild MiniFMOD\minifmod.sln
          /m
          /p:Configuration=Release
          /p:Platform=${{ matrix.platform }}
          /p:WindowsTargetPlatformVersion=10.0

      - name: Build QUnpack
        shell: cmd
        run: >
          msbuild QUnpack.sln
          /m
          /p:Configuration="Release EXE Unicode"
          /p:Platform=${{ matrix.platform }}
          /p:WindowsTargetPlatformVersion=10.0

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QUnpack-${{ matrix.platform }}
          path: |
            _*Release/**
            !_*Release/**/*.obj
            !_*Release/**/*.pdb
          if-no-files-found: error
